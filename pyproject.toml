[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hal9000-inside"
version = "0.3.11"
description = "HAL 9000 Inside - Ubuntu Voice Assistant"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    "piper-tts",
    "onnxruntime",
    "tokenizers",
    "numpy",
    "websockets",
    "sounddevice",
    "httpx",
    "pydantic",
    "qdrant-client",
    "mcp",
    "free-search-mcp==0.13.1",
    "selectolax<1.0.0",
]

[project.scripts]
hal9000-inside = "hal9000_inside.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hal9000_inside*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "snap_root",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]

